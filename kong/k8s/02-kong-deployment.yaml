apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: kong
  labels:
    app: kong
spec:
  replicas: 2
  # A restart must never drop traffic: this hostname is the public crAPI URL and a nightly test
  # plan runs against it.
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.6.1
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            # Admin API on all interfaces *inside the pod only*; the Service keeps it ClusterIP,
            # so it is reachable by kubectl port-forward and by nothing outside the cluster.
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 30
            # Explicit, because the default is one second: a busy admin API answering in 1.2s is
            # not a dead Kong, and killing it on that basis is what produced the restart loop.
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # Measured at 441Mi against the old 512Mi ceiling -- 86% -- and climbing over hours
              # until the admin API stalled. CPU was never the constraint: 6m of 500m in use.
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: declarative-config
              mountPath: /kong/declarative
              readOnly: true
      volumes:
        - name: declarative-config
          configMap:
            name: kong-declarative-config
