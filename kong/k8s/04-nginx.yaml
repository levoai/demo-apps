# nginx in front of Kong, mirroring the customer's topology: their edge is nginx, and Kong sits
# behind it handling the API layer. Two hops rather than one is the point -- a trace taken here
# should look like a trace taken at the customer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: kong
data:
  default.conf: |
    upstream kong_proxy {
        server kong.kong.svc.cluster.local:8000;
    }

    server {
        listen 80;
        server_name _;

        access_log /dev/stdout;
        error_log  /dev/stderr;

        # Everything goes to Kong. nginx is the door; Kong decides which service.
        location / {
            proxy_pass http://kong_proxy;
            proxy_http_version 1.1;

            # Kong routes on Host, so the original one has to survive the hop.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # For probes: answered by nginx itself, so a Kong outage does not take nginx down with it.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: kong
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: kong
  labels:
    app: nginx
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
