apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: kong
  labels:
    app: kong
spec:
  # ClusterIP on purpose. The admin API must never be reachable from outside the cluster; use
  # `kubectl -n kong port-forward svc/kong 8001:8001` to read it.
  type: ClusterIP
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
    - name: admin
      port: 8001
      targetPort: admin
