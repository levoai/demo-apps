name: Generate crAPI load

on:
  # pull_request:
  #   paths:
  #     - .github/workflows/generate_load.yml
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  # The "Prod" job that used to live here targeted https://crapi-dev-catalog-tests.levoai.app
  # and was removed on 2026-08-19: that cluster has no `crapi` namespace at all, so the
  # tunnel's `https://crapi-web.crapi:443` route has nothing behind it and returns 502 to
  # every request. Locust's users could not start, so the job sent zero requests, reported
  # zero failures and passed -- it had been green while doing nothing for at least ten days.
  #
  # Despite the name it never touched production: dev-catalog-tests is the platform twin,
  # and the catalog tests that exercise crAPI already run against crapi-dev-spec-building.
  # If a crAPI is ever deployed on that cluster (manifests: crAPI/deploy/k8s), restore the
  # job rather than pointing this one somewhere else.
  generate-crapi-load-dev:
    name: Generate crAPI load for dev spec-building
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Load against Dev e2e
        uses: apardo04/locust-github-action@master
        with:
          LOCUSTFILE: "crAPI/services/loadgen/locustfile.py"
          URL:  "https://crapi-dev-spec-building.levoai.app"
          # 5 users at rate 5 trips the edge rate limiter: measured 44-64% of requests
          # returning 429, including signup, so the users never get a token and the
          # authenticated endpoints are never exercised. Paced traffic gets through:
          # 2 users -> ~21% failures, 1 paced user -> 0%.
          USERS: "2"
          RATE: "1"
          RUNTIME: "10m"
