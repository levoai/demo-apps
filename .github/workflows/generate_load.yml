name: Generate crAPI load

on:
  # pull_request:
  #   paths:
  #     - .github/workflows/generate_load.yml
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  generate-crapi-load-prod:
    name: Generate crAPI load for Prod
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This target has been returning 502 to every request; locust's users cannot start,
      # so the job sends zero requests, reports zero failures and passes. Gate on the
      # target being reachable so a dead host fails loudly instead of going green.
      - name: Check the target is reachable
        run: |
          code=$(curl -sk -o /dev/null -w "%{http_code}" -m 20 https://crapi-dev-catalog-tests.levoai.app/)
          echo "target returned $code"
          [ "$code" = "200" ] || { echo "::error::target is not serving traffic (HTTP $code)"; exit 1; }

      - name: Run Load against prod Demo
        uses: apardo04/locust-github-action@master
        with:
          LOCUSTFILE: "crAPI/services/loadgen/locustfile.py"
          URL:  "https://crapi-dev-catalog-tests.levoai.app"
          USERS: "5"
          RATE: "5"
          RUNTIME: "3m"

  generate-crapi-load-dev:
    name: Generate crAPI load for Dev
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Load against Dev e2e
        uses: apardo04/locust-github-action@master
        with:
          LOCUSTFILE: "crAPI/services/loadgen/locustfile.py"
          URL:  "https://crapi-dev-spec-building.levoai.app"
          # 5 users at rate 5 trips the edge rate limiter: measured 44-64% of requests
          # returning 429, including signup, so the users never get a token and the
          # authenticated endpoints are never exercised. Paced traffic gets through:
          # 2 users -> ~21% failures, 1 paced user -> 0%.
          USERS: "2"
          RATE: "1"
          RUNTIME: "10m"
